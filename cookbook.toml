version = 1
recipe = "godot-addon"

[package]
source = "addon"
manifest = "package.files"
archive = "dist/@aviorstudio_gd-network.zip"

[lint]
required_paths = ["addon/plugin.cfg", "addon/plugin.gd", "package.files"]

[format]
paths = ["addon", "tests"]

[clean]
paths = ["dist", ".artifacts/build", ".artifacts/godot", ".artifacts/godot-data", ".artifacts/playwright", ".artifacts/tmp", ".godot"]

[[tests.unit]]
runner = "bash"
path = "tests/runner_self_test.sh"
timeout = 120

[[tests.unit]]
runner = "godot-suite"
path = "tests"
sentinel = "PASS gd-network"
timeout = 60

[[tests.integration]]
runner = "bash"
path = "tests/http_integration_test.sh"
timeout = 600

[[tests.integration]]
runner = "bash"
path = "tests/package_test.sh"
timeout = 300

[[tests.e2e]]
runner = "bash"
path = "tests/web_integration_test.sh"
timeout = 600

[publication]
tag_prefix = "v"
initial = "first"

[node]
packages = ["."]

[components.browser]
package = "."
