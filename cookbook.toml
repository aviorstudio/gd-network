version = 1
recipe = "godot-addon"

[package]
source = "addon"
manifest = "package.files"
archive = "dist/@aviorstudio_gd-network.zip"

[lint]
required_paths = ["addon/plugin.cfg", "addon/plugin.gd", "package.files"]

[format]
paths = ["addon", "tests/connection_state_module_test.gd", "tests/error_catalog_module_test.gd", "tests/gate_fixtures/no_sentinel.gd", "tests/gate_fixtures/overwritten_quit.gd", "tests/gate_fixtures/passing.gd", "tests/gate_fixtures/runtime_error_zero.gd", "tests/gate_fixtures/timeout.gd", "tests/http_client_module_test.gd", "tests/http_native_integration.gd", "tests/http_pool_module_test.gd", "tests/network_windowing_module_test.gd", "tests/rate_limit_module_test.gd", "tests/retry_backoff_module_test.gd", "tests/web_fetch_bridge_module_test.gd", "tests/web_fixture/main.gd", "tests/websocket_client_module_load_test.gd", "tests/websocket_client_module_state_test.gd"]

[clean]
paths = ["dist", ".artifacts/build", ".artifacts/godot", ".artifacts/godot-data", ".artifacts/playwright", ".artifacts/tmp", ".godot"]

[[tests.unit]]
runner = "bash"
path = "tests/runner_self_test.sh"
timeout = 120

[[tests.unit]]
runner = "godot-suite"
path = "tests"
sentinel = "PASS gd-network"
timeout = 60

[[tests.integration]]
runner = "bash"
path = "tests/http_integration_test.sh"
timeout = 600

[[tests.integration]]
runner = "bash"
path = "tests/package_test.sh"
timeout = 300

[[tests.e2e]]
runner = "bash"
path = "tests/web_integration_test.sh"
timeout = 600

[publication]
environment = "release"
validation_timeout = 20
publish_timeout = 10
retry = true
tag_prefix = "v"
initial = "first"

[node]
packages = ["."]

[components.browser]
package = "."
