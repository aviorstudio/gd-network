name: "Set up Godot"
description: Install caller-pinned engine and templates through released shared setup
inputs:
  godot-version:
    description: Godot version to install
    required: true
  godot-linux-x86-64-sha256:
    description: SHA-256 of the immutable Linux x86_64 release ZIP
    required: true
  install-templates:
    description: Install web export templates
    required: false
    default: 'false'
  godot-templates-sha256:
    description: SHA-256 of the export templates archive
    required: false
    default: ''
runs:
  using: composite
  steps:
  - name: "Set up Godot"
    uses: nicodes/tools/godot-setup@247267492cd455647facafcfcc6eed4c63c49c0e # v0.27.2
    with:
      version: ${{ inputs.godot-version }}
      origin: godot
      binary-checksum: sha256:${{ inputs.godot-linux-x86-64-sha256 }}
      templates-checksum: sha256:${{ inputs.godot-templates-sha256 }}
      install-templates: ${{ inputs.install-templates }}
      expected-version: 4.7.2.stable.official.ed1daf0bf
