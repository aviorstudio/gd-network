name: Setup Godot
description: Install a checksummed Godot Linux binary
inputs:
  godot-version:
    description: Godot version to install
    required: true
  godot-linux-x86-64-sha256:
    description: SHA-256 of the immutable Linux x86_64 release ZIP
    required: true
  install-templates:
    description: Install web export templates
    required: false
    default: 'false'
  godot-templates-sha256:
    description: SHA-256 of the export templates archive
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Cache checksummed Godot archive
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/aviorstudio/godot/${{ inputs.godot-version }}
        key: godot-${{ inputs.godot-version }}-linux-x86-64-${{ inputs.godot-linux-x86-64-sha256 }}

    - name: Download, verify, and install Godot
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
        GODOT_SHA256: ${{ inputs.godot-linux-x86-64-sha256 }}
      run: |
        set -euo pipefail
        install_dir="$HOME/.cache/aviorstudio/godot/$GODOT_VERSION"
        archive="$install_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        binary="$install_dir/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
        mkdir -p "$install_dir"
        if [ ! -f "$archive" ]; then
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$(basename "$archive")"
        fi
        printf '%s  %s\n' "$GODOT_SHA256" "$archive" | sha256sum --check --strict
        if [ ! -x "$binary" ]; then
          unzip -q -o "$archive" -d "$install_dir"
          chmod +x "$binary"
        fi
        ln -sf "$binary" "$install_dir/godot"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Verify Godot installation
      shell: bash
      run: |
        set -euo pipefail
        version="$(godot --version)"
        case "$version" in
          4.7.2.stable.*) printf '%s\n' "$version" ;;
          *) echo "Unexpected Godot version: $version" >&2; exit 1 ;;
        esac

    - name: Download, verify, and install export templates
      if: inputs.install-templates == 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
        TEMPLATES_SHA256: ${{ inputs.godot-templates-sha256 }}
      run: |
        set -euo pipefail
        test -n "$TEMPLATES_SHA256"
        cache_dir="$HOME/.cache/aviorstudio/godot/$GODOT_VERSION"
        archive="$cache_dir/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
        if [ ! -f "$archive" ]; then
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$(basename "$archive")"
        fi
        printf '%s  %s\n' "$TEMPLATES_SHA256" "$archive" | sha256sum --check --strict
        if [ ! -f "$target/web_nothreads_release.zip" ]; then
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          unzip -q "$archive" 'templates/web_nothreads_release.zip' 'templates/web_nothreads_debug.zip' -d "$temporary"
          mkdir -p "$target"
          cp -R "$temporary/templates/." "$target/"
        fi
