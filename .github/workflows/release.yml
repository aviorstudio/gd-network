name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. Ignored when retry-tag and retry-sha256 are both set.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      retry-tag:
        description: Existing immutable vX.Y.Z tag to republish. Empty for a normal bump.
        required: false
        type: string
      retry-sha256:
        description: Required SHA-256 of the existing release ZIP when retry-tag is set.
        required: false
        type: string

permissions:
  contents: read

concurrency: release-${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      retry: ${{ steps.release.outputs.retry }}
      target: ${{ steps.release.outputs.target }}
      sha256: ${{ steps.release.outputs.sha256 }}
    # Bounded, so a step that hangs fails here rather than sitting until the
    # runner's own timeout hours later.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          RETRY_TAG: ${{ inputs['retry-tag'] }}
          RETRY_SHA256: ${{ inputs['retry-sha256'] }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          ./scripts/release_recovery.sh plan

      # The same checks CI runs, from the same definition. Skipped on retry:
      # retry republishes the existing ZIP and must not package a new one.
      - name: Test exact release commit and package
        if: steps.release.outputs.retry != 'true'
        uses: ./.github/actions/test

      - name: Recover existing immutable release package
        if: steps.release.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          EXPECTED_SHA256: ${{ steps.release.outputs.sha256 }}
          TARGET: ${{ steps.release.outputs.target }}
        run: ./scripts/release_recovery.sh recover

      - name: Upload exact tested package
        if: steps.release.outputs.retry != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/@aviorstudio_gd-network.zip
            dist/@aviorstudio_gd-network.zip.sha256
            dist/installed-tree.sha256
            dist/web-acceptance.png
          if-no-files-found: error

      - name: Upload recovered release package
        if: steps.release.outputs.retry == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package-${{ github.sha }}
          path: |
            dist/@aviorstudio_gd-network.zip
            dist/@aviorstudio_gd-network.zip.sha256
          if-no-files-found: error

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download exact tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-package-${{ github.sha }}
          path: dist

      - name: Verify downloaded package identity
        run: bash ./scripts/verify_package_checksum.sh

      - name: Create GitHub Release
        if: needs.test.outputs.retry != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
          RETRY: ${{ needs.test.outputs.retry }}
          RETRY_TAG: ${{ inputs['retry-tag'] }}
          RETRY_SHA256: ${{ inputs['retry-sha256'] }}
        run: |
          set -euo pipefail
          ./scripts/release_recovery.sh assert-bump
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" --title "$TAG" --notes "Release $TAG"

      - name: Verify existing GitHub Release
        if: needs.test.outputs.retry == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.test.outputs.tag }}
          TARGET: ${{ needs.test.outputs.target }}
          EXPECTED_SHA256: ${{ needs.test.outputs.sha256 }}
        run: ./scripts/release_recovery.sh recheck

      - name: Install checksum-verified GDAM v0.0.8
        id: install-gdam
        uses: aviorstudio/gdam-actions/install@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          version: 'v0.0.8'

      - name: Verify GDAM version
        env:
          INSTALLED_VERSION: ${{ steps.install-gdam.outputs.version }}
        run: |
          case "$INSTALLED_VERSION" in
            *0.0.8*) printf '%s\n' "$INSTALLED_VERSION" ;;
            *) echo "Unexpected GDAM version: $INSTALLED_VERSION" >&2; exit 1 ;;
          esac

      - name: Publish exact GitHub asset to GDAM
        uses: aviorstudio/gdam-actions/publish@d735444eb470194585def44521d5d91df2260e63 # v0.0.2
        with:
          tag: ${{ needs.test.outputs.tag }}
          addon: '@aviorstudio/gd-network'
          asset: '@aviorstudio_gd-network.zip'
          secret-key: ${{ secrets.GDAM_SECRET_KEY }}
